spring.application.name=ecommerce

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Perfil activo por defecto
spring.profiles.active=dev

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Ordena los endpoints por
# metodo HTTP (GET, POST, PATCH, DELETE)
springdoc.swagger-ui.operations-sorter=method

# Agrupa por tags
springdoc.swagger-ui.tags-sorter=alpha

# Swagger UI disponible en: http://localhost:8080/swagger-ui.html

# Storage
api.storage.provider=local
api.storage.local.path=uploads/comprobantes
api.storage.allowed-types=image/png,image/jpeg,application/pdf
api.storage.max-size-mb=5

# Cloudinary (completar cuando tengas la cuenta)
# api.storage.cloudinary.cloud-name=tu_cloud_name
# api.storage.cloudinary.api-key=tu_api_key
# api.storage.cloudinary.api-secret=tu_api_secret

# Carrito - Retencion en 2 etapas
api.carrito.dias-retencion-expirados=30

# ==========================================
# SEGURIDAD JWT - DOBLE TOKEN (ACCESS + REFRESH)
# ==========================================
api.security.secret=${JWT_SECRET:CUALQUIER_STRING_LARGO_PARA_DEV}
api.security.expiration=${JWT_ACCESS_EXPIRATION_SECONDS:900}
api.security.access-expiration-cliente-seconds=${JWT_ACCESS_CLIENTE_SECONDS:900}
api.security.access-expiration-admin-seconds=${JWT_ACCESS_ADMIN_SECONDS:600}
api.security.refresh-expiration-cliente-days=${JWT_REFRESH_CLIENTE_DAYS:14}
api.security.refresh-expiration-admin-days=${JWT_REFRESH_ADMIN_DAYS:1}

# Cookie HttpOnly para Refresh Token
api.security.cookie.name=${JWT_REFRESH_COOKIE_NAME:refresh_token}
api.security.cookie.secure=${JWT_REFRESH_COOKIE_SECURE:true}
api.security.cookie.same-site=${JWT_REFRESH_COOKIE_SAMESITE:Strict}
api.security.cookie.path=${JWT_REFRESH_COOKIE_PATH:/api/auth}

# Retencion y purga nocturna de Refresh Tokens en BD
api.security.refresh-retention-days=${JWT_REFRESH_RETENTION_DAYS:30}
api.security.refresh-purge-cron=${JWT_REFRESH_PURGE_CRON:0 30 3 * * *}

# CORS Origenes permitidos
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
