# =============================================================================
# Perfil de País: Chile (cl)
# Se combina con el perfil de entorno:
#   - Desarrollo:  spring.profiles.active=dev,cl
#   - Producción:  spring.profiles.active=prod,cl
# =============================================================================

# País
api.pais.codigo=CL
api.pais.nombre=Chile

# Moneda - Peso chileno (sin decimales)
api.moneda.codigo=CLP
api.moneda.simbolo=$
api.moneda.nombre=Peso Chileno
api.moneda.locale=es-CL
api.moneda.decimales=0

# Impuestos (IVA Chile: 19%)
api.impuestos.iva=0.19

# Envío gratis a partir de $50.000 CLP
api.envio.monto-minimo-gratis=50000
