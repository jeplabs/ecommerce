spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@ecommerce.com
spring.mail.password=testpassword

# JWT & Seguridad
api.security.secret=test-secret-key-for-testing-purposes-only-32chars
api.security.expiration=3600
api.security.lockout-minutes=30
api.security.reset-token-expiracion-minutos=30

# Negocio
api.impuestos.iva=0.12
api.envio.monto-minimo-gratis=500.00

# Carrito
api.carrito.expiracion-minutos=5
api.carrito.notificacion-minutos-antes=3
